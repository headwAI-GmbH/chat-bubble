services:
  # Open WebUI Backend Configuration
  backend:
    # Override with BACKEND_IMAGE to test a specific version, e.g. ghcr.io/open-webui/open-webui:v0.12.3
    image: ${BACKEND_IMAGE:-ghcr.io/open-webui/open-webui:main}
    platform: linux/amd64
    container_name: openwebui-backend-e2e
    volumes:
      - openwebui-data:/app/backend/data

  # Chat Bubble with Open WebUI configuration
  chat-bubble-dev:
    environment:
      VITE_CHAT_BUBBLE_API_KEY: 'sk-test-api-key'
      VITE_CHAT_BUBBLE_CHAT_TITLE: 'Open WebUI Assistant'

volumes:
  openwebui-data:
    driver: local
